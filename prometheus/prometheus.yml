# Four scrape jobs, 2s global interval. The cadvisor job uses
# metric_relabel_configs to stamp namespace="burstops" ONLY onto the two
# dummy-backend replicas (matched by container name regex) — averaging CPU
# across the whole Compose stack (Grafana, Locust, Prometheus itself, etc.)
# would dilute the reading so far that the 80% burst line could never be
# crossed.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container]
        regex: '.*/?burstops-backend-[12]$'
        target_label: namespace
        replacement: burstops
      - source_labels: [container_label_com_docker_compose_service]
        regex: 'dummy-backend-[12]'
        target_label: namespace
        replacement: burstops
      - action: keep
        source_labels: [__name__]
        regex: 'container_cpu_usage_seconds_total|container_memory_usage_bytes|container_spec_cpu_quota'

  - job_name: burstops-gateway
    static_configs:
      - targets: ["gateway:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'gateway_.*'
        action: keep

  - job_name: cpu-sim
    static_configs:
      - targets: ["cpu-sim:8002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
