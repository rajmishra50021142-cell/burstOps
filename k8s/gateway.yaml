apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstops-gateway
  namespace: burstops-system
  labels:
    app: burstops-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: burstops-gateway
  template:
    metadata:
      labels:
        app: burstops-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: acrburstopsga3cvf.azurecr.io/burstops-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: K8S_UPSTREAM
              value: "http://burstops-backend.burstops.svc.cluster.local:8000"
            - name: FUNCTION_UPSTREAM
              value: "https://func-burstops-cloud-ga3cvf.azurewebsites.net/api/calculate"
            - name: PROMETHEUS_URL
              value: "http://kps-prometheus.monitoring.svc.cluster.local:9090/api/v1/query"
            - name: REDIS_URL
              value: "redis://burstops-redis.burstops-system.svc.cluster.local:6379/0"
            - name: OTEL_TRACES_EXPORTER
              value: "console"
            - name: OTEL_SERVICE_NAME
              value: "burstops-gateway"
            - name: DEPLOY_ENV
              value: "production"
            - name: OTEL_BASELINE_SAMPLE_RATIO
              value: "1.0"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: burstops-gateway-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
            - name: GATEWAY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: burstops-gateway-secrets
                  key: GATEWAY_HMAC_SECRET
            - name: FUNCTION_KEY
              valueFrom:
                secretKeyRef:
                  name: burstops-gateway-secrets
                  key: FUNCTION_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: burstops-gateway
  namespace: burstops-system
  labels:
    app: burstops-gateway
spec:
  type: ClusterIP
  selector:
    app: burstops-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
