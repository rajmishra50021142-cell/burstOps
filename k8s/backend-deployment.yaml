apiVersion: apps/v1
kind: Deployment
metadata:
  name: burstops-backend
  namespace: burstops
  labels:
    app: burstops-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: burstops-backend
  template:
    metadata:
      labels:
        app: burstops-backend
        burstops-namespace: burstops
    spec:
      containers:
        - name: backend
          image: acrburstopsga3cvf.azurecr.io/burstops-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
