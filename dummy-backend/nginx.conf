# VIP load balancer in front of the two dummy-backend replicas, simulating a
# K8s Service load-balancing across pod replicas.
worker_processes 1;
events { worker_connections 1024; }
http {
    upstream dummy_backend_vip {
        server dummy-backend-1:8000;
        server dummy-backend-2:8000;
    }
    server {
        listen 8000;
        location / {
            proxy_pass http://dummy_backend_vip;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
